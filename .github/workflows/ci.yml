name: CI
on: [push, pull_request]
jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 for UE4SS research specs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Run UE4SS research toolkit Lua specs
        if: runner.os == 'Linux'
        working-directory: mod/ue4ss/HogwartsRPResearch
        run: |
          lua5.4 tests/property_value_audit_spec.lua
          lua5.4 tests/component_property_catalog_spec.lua
      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format Rust workspace
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Test Rust workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace --exclude hogwartsrp-launcher
      - name: Build Rust worker integration fixture
        run: cargo build --manifest-path rust/Cargo.toml -p hogwartsrp-test-worker
      - name: Configure Rust worker integration fixture path
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { ".exe" } else { "" }
          "HOGWARTSRP_TEST_WORKER_PATH=$env:GITHUB_WORKSPACE/rust/target/debug/hogwartsrp-test-worker$suffix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build native Rust launcher (Windows)
        if: runner.os == 'Windows'
        run: cargo build --manifest-path rust/Cargo.toml --release -p hogwartsrp-launcher
      - run: dotnet restore HogwartsRP.slnx
      - run: dotnet build HogwartsRP.slnx --no-restore
      - run: dotnet test HogwartsRP.slnx --no-build
      - name: Test sanitized UE4SS diagnostic report
        shell: pwsh
        run: ./tools/diagnostics/Test-HogwartsRPDiagnosticReport.ps1
