name: Ticket Bot CI
on:
  push:
    paths:
      - 'services/discord-ticket-bot/**'
  pull_request:
    paths:
      - 'services/discord-ticket-bot/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/discord-ticket-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: docker build -t hogwartsrp-ticket-bot:test .
