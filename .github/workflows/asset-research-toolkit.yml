name: Asset Research Toolkit
on:
  push:
    paths:
      - "tools/asset-research/**"
      - ".github/workflows/asset-research-toolkit.yml"
  pull_request:
    paths:
      - "tools/asset-research/**"
      - ".github/workflows/asset-research-toolkit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run asset research unit tests
        working-directory: tools/asset-research
        run: python -m unittest discover -s tests -v
      - name: Validate CLI help
        working-directory: tools/asset-research
        run: python asset_research.py --help
